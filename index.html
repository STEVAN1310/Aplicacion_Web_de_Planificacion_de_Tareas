<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOD OF TASKS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    
</head>

<body>
  
    <header>
       <center><h1>GOD OF TASKS</h1></center> 
        <p>Conquista tus misiones diarias</p>

        <nav>
            <a href="#Inicio">Inicio</a>
            <a href="#Misiones">Misiones</a>
            <a href="#Progreso">Progreso</a>
            <a href="#Estadisticas">Estadisticas</a>
        </nav>
    </header>

<main id="Inicio">
    <section id="Misiones" class="container my-4">
        <button id="btnNuevaMision" class="btn btn-info mb-3">
            + Nueva Misión
        </button>
        <section id="FormularioMision" class="container my-4 d-none">
    <h3 class="text-cyan">Crear Nueva Misión</h3>
    
    <!-- Alerta de Bootstrap para errores (inicialmente oculta con d-none) -->
    <div id="alertError" class="alert alert-danger d-none" role="alert">
        Por favor completa todos los campos correctamente.
    </div>

    <form id="taskForm" novalidate>    
        <div class="mb-3">
            <label for="newTaskNameInput" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="newTaskNameInput" required>
        </div>
        <div class="mb-3">
            <label for="newTaskDescriptionInput" class="form-label">Descripción</label>
            <textarea class="form-control" id="newTaskDescriptionInput" rows="2" required></textarea>
        </div>
        <div class="mb-3">
            <label for="newTaskDateInput" class="form-label">Fecha de entrega</label>
            <input type="date" class="form-control" id="newTaskDateInput" required>
        </div>
        <div class="mb-3">
            <label for="newTaskStatusInput" class="form-label">Estado</label>
            <select class="form-select" id="newTaskStatusInput" required>
                <option value="" selected disabled>Selecciona una opción</option>
                <option value="Pendiente">Pendiente</option>
                <option value="En progreso">En progreso</option>
                <option value="Completada">Completada</option>
            </select>
        </div>
        <button type="submit" class="btn btn-info">Guardar Misión</button>
    </form>
</section>

        <div id="ListaMisiones" class="container">
                <div id="contenedorMisiones" class="list-group">

            </div>
            </div>

    </section>

<section id="Progreso">
    <h2>Progreso de mivel</h2>
    <p>Nivel 1 - Gurrero Novato</p>
    <progress value="0" max="100"></progress>
</section>

<section id="Estadisticas">
    <h2>Estadisticas semanales</h2>
    <p>Misiones completadas: 0</p>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
